name: Deploy to Render

on:
  push:
    branches: [main, master]
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Push API keys from GitHub Secrets into Render env vars ────
      # This is the missing link: GitHub Secrets don't reach Render automatically.
      # This step calls the Render API to update them before every deploy.
      - name: Sync API keys to Render
        env:
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          EXA_API_KEY:       ${{ secrets.EXA_API_KEY }}
          RENDER_API_KEY:    ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          python3 << 'EOF'
          import json, os, sys
          import urllib.request, urllib.error

          missing = [k for k in ["OPENAI_API_KEY", "RENDER_API_KEY", "RENDER_SERVICE_ID"]
                     if not os.environ.get(k)]
          if missing:
              print(f"ERROR: Missing GitHub Secrets: {', '.join(missing)}")
              print("Add them at: GitHub repo → Settings → Secrets and variables → Actions")
              sys.exit(1)

          env_vars = [{"key": "OPENAI_API_KEY", "value": os.environ["OPENAI_API_KEY"]}]
          if os.environ.get("EXA_API_KEY"):
              env_vars.append({"key": "EXA_API_KEY", "value": os.environ["EXA_API_KEY"]})

          url = f'https://api.render.com/v1/services/{os.environ["RENDER_SERVICE_ID"]}/env-vars'
          req = urllib.request.Request(url, data=json.dumps(env_vars).encode(), method='PUT')
          req.add_header('Authorization', f'Bearer {os.environ["RENDER_API_KEY"]}')
          req.add_header('Content-Type', 'application/json')

          try:
              with urllib.request.urlopen(req) as resp:
                  print(f'API keys synced to Render — HTTP {resp.status}')
          except urllib.error.HTTPError as e:
              print(f'Failed to sync env vars: HTTP {e.code}')
              print(e.read().decode())
              sys.exit(1)
          EOF

      # ── Step 2: Trigger a new Render deployment ────────────────────────────
      - name: Trigger Render deployment
        env:
          RENDER_API_KEY:    ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          response=$(curl -sf -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          http_code=$(echo "$response" | tail -n1)
          if [ "$http_code" != "201" ] && [ "$http_code" != "200" ]; then
            echo "Deploy trigger failed: HTTP $http_code"
            exit 1
          fi
          echo "Render deploy triggered successfully."
